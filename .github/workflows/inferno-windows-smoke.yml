name: Inferno Windows engine smoke

on:
  push:
    branches: [test/inferno-windows-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-gnutls
            mingw-w64-ucrt-x86_64-nettle
            mingw-w64-ucrt-x86_64-libslirp
      - name: Build pinned LZFSE dependency
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)/lzfse"
          git clone --quiet https://github.com/lzfse/lzfse.git "$source_dir"
          git -C "$source_dir" checkout --detach e634ca58b4821d9f3d560cdc6df5dec02ffc93fd
          test "$(git -C "$source_dir" rev-parse HEAD)" = e634ca58b4821d9f3d560cdc6df5dec02ffc93fd
          cmake -S "$source_dir" -B "$source_dir/build" -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 -DBUILD_SHARED_LIBS=OFF -DLZFSE_DISABLE_TESTS=ON
          cmake --build "$source_dir/build" --target install -j 4
          test -f /ucrt64/include/lzfse.h
          test -f /ucrt64/lib/liblzfse.a
      - name: Fetch pinned Inferno source
        shell: pwsh
        run: |
          $repo = Join-Path $env:RUNNER_TEMP 'Inferno'
          git init $repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $repo remote add origin https://github.com/ChefKissInc/Inferno.git
          git -C $repo fetch --depth 1 origin cc4302a99167abec69b714cfd00c38caece7e7de
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $repo checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $repo submodule update --init --depth 1 util/mlib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and probe native Windows engine
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $repo = Join-Path $env:RUNNER_TEMP 'Inferno'
          $output = Join-Path $env:RUNNER_TEMP 'inferno-smoke-output'
          try {
            ./scripts/build_ios_inferno_windows.ps1 -Repository $repo -Output $output -Jobs 4
          } finally {
            $log = Join-Path $output 'build.log'
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
          }
