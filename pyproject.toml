[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huntmob"
version = "0.1.0"
description = "Governed Android and iOS analysis runtime for HuntBox/Draxen"
requires-python = ">=3.9"

[project.scripts]
huntmob = "huntmob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

